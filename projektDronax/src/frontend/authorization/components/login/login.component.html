<div class="auth-container">
  <div class="auth-box">
      <h2>Login</h2>
      <form novalidate #loginForm="ngForm">
          
          <!-- Username -->
          <div class="form-group" id="grey">
              <label for="username">Username:</label>
              <input type="text" id="username" class="form-control" [(ngModel)]="username" name="username" placeholder="Username" required #usernameCtrl="ngModel">
              <div *ngIf="usernameCtrl.invalid && usernameCtrl.touched" class="text-danger" id="errorDiv">
                  <p>Username is required</p>
              </div>
          </div>

          <!-- Password -->
          <div class="form-group" id="grey">
              <label for="password">Password:</label>
              <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password" placeholder="Password" required #passwordCtrl="ngModel">
              <div *ngIf="passwordCtrl.invalid && passwordCtrl.touched" class="text-danger" id="errorDiv">
                  <p>Password is required</p>
              </div>
          </div>

          <!-- Login Button -->
          <div class="form-group d-flex mt-3">
              <button (click)="login(loginForm)" type="submit" class="btn btn-primary flex-grow-1" [disabled]="loginForm.invalid">Login</button>
          </div>

          <!-- Error Message -->
          <p id="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
      </form>

      <!-- Register Link -->
      <p id="grey">Don't have an account? <a routerLink="/register">Register here</a></p>
  </div>
</div>
